[tool.poetry]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Multi-tenant RAG assistant — upload documents, ask questions, get cited answers."
authors = ["Tristan Bookhan <tristandeclanbookhan@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136"
uvicorn = { extras = ["standard"], version = "^0.34" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = { extras = ["email"], version = "^2.10" }
pydantic-settings = "^2.7"
PyJWT = { extras = ["crypto"], version = "^2.0" }
bcrypt = "^4.0"
pgvector = "^0.3"
langchain = "^1.2"
langchain-openai = "^1.2"
langchain-ollama = "^1.1"
langchain-community = "^0.4"
langgraph = "^1.1"
pypdf = "^4.2"
python-docx = "^1.1"
python-multipart = "^0.0.20"
jinja2 = "^3.1"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
fpdf2 = "^2.7"
ruff = "^0.8"
mypy = "^1.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
