# Deploys the app to Amazon EKS on every push to main.
#
# This is a SKELETON: it is valid YAML but a no-op until real AWS infrastructure
# exists (see backlog E9: Terraform modules, E10: full deployment). Placeholder
# values below need to be replaced once that infrastructure is provisioned —
# see docs/05-runbook.md for the full step-by-step.
#
# Setup steps once AWS is ready:
#
# 1. Apply infra/terraform — this creates the ECR repo, EKS cluster, and the
#    OIDC role this workflow assumes below. Replace AWS_REGION, ECR_REPOSITORY,
#    EKS_DEPLOYMENT, CONTAINER_NAME with the real values from `terraform output`.
#
# 2. Store the OIDC role's ARN (terraform output github_actions_role_arn) as
#    a GitHub secret named AWS_CD_ROLE_ARN. No AWS access keys needed —
#    this workflow authenticates via OIDC, not long-lived static credentials.
#
# 3. Store a kubeconfig for the cluster as a GitHub Actions secret named
#    KUBE_CONFIG_DATA (base64-encoded).
#
# 4. Replace APP_URL with the public ALB/ingress URL once one exists, so the
#    smoke test step can actually reach the deployed app.

name: Deploy to EKS

on:
  push:
    branches: [main]

env:
  AWS_REGION: MY_AWS_REGION # e.g. us-west-1
  ECR_REPOSITORY: MY_ECR_REPOSITORY
  EKS_DEPLOYMENT: MY_EKS_DEPLOYMENT # k8s Deployment name, e.g. rag-api
  CONTAINER_NAME: MY_CONTAINER_NAME # container name inside that Deployment's pod spec
  APP_URL: MY_APP_URL # public ALB/ingress URL, e.g. https://rag.example.com

permissions:
  contents: read
  id-token: write # required for OIDC — lets this workflow request a short-lived AWS token

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EKS cluster
        uses: kodermax/kubectl-aws-eks@v1
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        with:
          args: >-
            set image deployment/${{ env.EKS_DEPLOYMENT }}
            ${{ env.CONTAINER_NAME }}=${{ steps.build-image.outputs.image }}

      - name: Verify deployment
        uses: kodermax/kubectl-aws-eks@v1
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        with:
          args: rollout status deployment/${{ env.EKS_DEPLOYMENT }}

      - name: Smoke test /health
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10: got HTTP $status, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1
