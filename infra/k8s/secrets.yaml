# PLACEHOLDER VALUES ONLY — this file is tracked in git, never put a real
# secret in it. Real values live in AWS Secrets Manager, created by
# infra/terraform/modules/secrets. At deploy time, replace stringData below
# with real values (e.g. `aws secretsmanager get-secret-value` piped into
# `kubectl create secret generic --dry-run=client -o yaml`), or install the
# External Secrets Operator later to sync these automatically instead of
# hand-editing this file.
apiVersion: v1
kind: Secret
metadata:
  name: rag-api-secrets
  namespace: rag-assistant
type: Opaque
stringData:
  DATABASE_URL: "CHANGEME"
  JWT_SECRET: "CHANGEME"
  OPENAI_API_KEY: "CHANGEME"
  TAVILY_API_KEY: "CHANGEME"
